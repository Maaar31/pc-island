[package]
name = "island"
version = "0.1.0"
description = "A hover-activated Windows desktop island"
authors = ["Island contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
arboard = "3.6"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Devices_Radios",
  "Media_Control"
] }
